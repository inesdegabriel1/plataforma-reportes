<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Swiftair Engine Health</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="off">
      <img src="logo.svg" alt="Swiftair" class="login-logo">
      <h1>Engine Health Monitoring</h1>
      <p class="muted">Acceso restringido. Introduce la contraseña.</p>
      <label for="login-password" class="sr-only">Contraseña</label>
      <input id="login-password" type="password" placeholder="Contraseña" required autocomplete="current-password">
      <button id="login-btn" type="submit" class="btn-primary">Entrar</button>
      <p id="login-error" class="error-text" role="alert"></p>
    </form>
  </main>

  <!-- Aplicación -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="logo.svg" alt="Swiftair" class="brand-logo">
        <div class="brand-text"><b>SWIFTAIR</b><span>Engine Health Monitoring</span></div>
        <span id="demo-flag" class="demo-flag" hidden>DEMO · datos simulados</span>
      </div>
      <nav class="nav">
        <a class="nav-link" href="#/flota">Flota</a>
      </nav>
      <div class="search">
        <input id="search" list="search-list" placeholder="Buscar matrícula o nº de serie de motor…" aria-label="Buscar avión o motor">
        <datalist id="search-list"></datalist>
      </div>
      <div class="top-actions">
        <button id="btn-refresh" class="btn-top" type="button" title="Recargar datos">↻</button>
        <button id="btn-theme" class="btn-top" type="button">☾ Oscuro</button>
        <button id="btn-logout" class="btn-top" type="button">Salir</button>
      </div>
    </header>
    <div class="accent-bar"></div>

    <div id="range-bar" class="range-bar">
      <span class="range-label">Periodo de las gráficas</span>
      <label>Desde <input id="desde" type="date"></label>
      <label>Hasta <input id="hasta" type="date"></label>
      <div class="chips">
        <button class="chip" data-range="3" type="button">3 meses</button>
        <button class="chip" data-range="6" type="button">6 meses</button>
        <button class="chip" data-range="12" type="button">1 año</button>
        <button class="chip" data-range="36" type="button">3 años</button>
      </div>
    </div>

    <main id="main" class="main"></main>
  </div>
</body>
</html>
